<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cell Tower Locator (Mozilla API)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    form {
      margin-bottom: 20px;
    }
    label {
      display: inline-block;
      width: 100px;
    }
    input, select {
      margin-bottom: 10px;
      width: 150px;
    }
    #map {
      height: 400px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }
    #locationInfo {
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Cell Tower Locator (Mozilla API)</h2>

<form id="locationForm">
  <label>Radio Type:</label>
  <select id="radioType">
    <option value="gsm">GSM</option>
    <option value="wcdma">WCDMA</option>
    <option value="lte">LTE</option>
    <option value="nr">5G (NR)</option>
  </select><br>

  <label>MCC:</label><input id="mcc" value="310"><br>
  <label>MNC:</label><input id="mnc" value="260"><br>
  <label>LAC:</label><input id="lac" value="7033"><br>
  <label>CID:</label><input id="cid" value="17811"><br>

  <button type="submit">Locate</button>
</form>

<div id="map"></div>
<div id="locationInfo">Location info will appear here after lookup.</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([20, 0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  let marker, circle;

  document.getElementById('locationForm').onsubmit = async function(e) {
    e.preventDefault();

    const radio = document.getElementById('radioType').value;
    const mcc = parseInt(document.getElementById('mcc').value);
    const mnc = parseInt(document.getElementById('mnc').value);
    const lac = parseInt(document.getElementById('lac').value);
    const cid = parseInt(document.getElementById('cid').value);

    const requestData = {
      cellTowers: [{
        radioType: radio,
        mobileCountryCode: mcc,
        mobileNetworkCode: mnc,
        locationAreaCode: lac,
        cellId: cid
      }]
    };

    try {
      const response = await fetch("https://location.services.mozilla.com/v1/geolocate?key=test", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestData)
      });

      const data = await response.json();

      if (data && data.location) {
        const { lat, lng } = data.location;
        const accuracy = data.accuracy;

        if (marker) map.removeLayer(marker);
        if (circle) map.removeLayer(circle);

        marker = L.marker([lat, lng]).addTo(map).bindPopup("📍 Estimated Location").openPopup();
        circle = L.circle([lat, lng], { radius: accuracy, color: 'green', fillOpacity: 0.2 }).addTo(map);
        map.setView([lat, lng], 13);

        document.getElementById('locationInfo').innerText =
          `Latitude: ${lat.toFixed(6)}, Longitude: ${lng.toFixed(6)}, Accuracy: ±${accuracy} meters`;
      } else {
        document.getElementById('locationInfo').innerText = "Location not found.";
      }
    } catch (err) {
      console.error(err);
      alert("Error fetching location.");
      document.getElementById('locationInfo').innerText = "Error retrieving location.";
    }
  };
</script>

</body>
</html>
