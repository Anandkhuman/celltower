<!DOCTYPE html>
<html>
<head>
  <title>Cell Tower Locator</title>
  <style>
    #result {
      margin-top: 20px;
    }
    #map {
      width: 100%;
      height: 400px;
      margin-top: 10px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h2>Cell Tower Location Finder</h2>
  <form id="locationForm">
    <label>Radio Type:</label>
    <select id="radioType">
      <option value="gsm">GSM</option>
      <option value="wcdma">WCDMA</option>
      <option value="lte">LTE</option>
      <option value="nr">5G (NR)</option>
    </select><br><br>

    <label>MCC:</label><input id="mcc" value="310"><br><br>
    <label>MNC:</label><input id="mnc" value="260"><br><br>
    <label>LAC:</label><input id="lac" value="7033"><br><br>
    <label>CID:</label><input id="cid" value="17811"><br><br>

    <button type="submit">Locate</button>
  </form>

  <div id="result">
    <p id="locationText">Location will appear here...</p>
    <iframe id="map" src="" allowfullscreen></iframe>
  </div>

  <script>
    document.getElementById('locationForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const radio = document.getElementById('radioType').value;
      const mcc = document.getElementById('mcc').value;
      const mnc = document.getElementById('mnc').value;
      const lac = document.getElementById('lac').value;
      const cid = document.getElementById('cid').value;

      const apiKey = 'pk.29e69f80b9f69d27836f37d2d63c5efb';

      const url = 'https://us1.unwiredlabs.com/v2/process.php';

      const payload = {
        token: apiKey,
        radio: radio,
        mcc: parseInt(mcc),
        mnc: parseInt(mnc),
        cells: [{ lac: parseInt(lac), cid: parseInt(cid) }],
        address: 1
      };

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.status === 'ok') {
          const lat = data.lat;
          const lon = data.lon;
          const address = data.address || "No address info";

          document.getElementById('locationText').innerText = `Latitude: ${lat}, Longitude: ${lon}\nAddress: ${address}`;
          document.getElementById('map').src = `https://maps.google.com/maps?q=${lat},${lon}&z=15&output=embed`;
        } else {
          document.getElementById('locationText').innerText = `Error: ${data.message || 'Unknown error'}`;
          document.getElementById('map').src = '';
        }
      } catch (error) {
        document.getElementById('locationText').innerText = 'Request failed. Check console for details.';
        console.error(error);
      }
    });
  </script>
</body>
</html>
