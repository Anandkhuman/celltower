<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cell Tower Locator</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      padding: 30px;
      margin: 0;
    }

    h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    form {
      background-color: #fff;
      color: #333;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    label {
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      background: #f1f1f1;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #1e88e5;
      color: #fff;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #1565c0;
    }

    #loadingBar {
      width: 100%;
      background-color: #ddd;
      border-radius: 8px;
      overflow: hidden;
      margin: 20px auto;
      height: 10px;
      display: none;
    }

    #progress {
      width: 0%;
      height: 10px;
      background: linear-gradient(90deg, #42a5f5, #1e88e5);
      animation: loading 2s linear infinite;
    }

    @keyframes loading {
      0% { width: 0; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    #result {
      text-align: center;
      margin-top: 30px;
    }

    #locationText {
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    #map {
      width: 100%;
      height: 400px;
      border-radius: 15px;
      border: 3px solid #fff;
    }

    .share-btn {
      margin-top: 20px;
      text-align: center;
    }

    .share-btn i {
      font-size: 1.5rem;
      color: #fff;
      background: #2196f3;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .share-btn i:hover {
      background: #1565c0;
    }
  </style>
</head>
<body>
  <h2>Cell Tower Location Finder</h2>

  <form id="locationForm">
    <label>Radio Type:</label>
    <select id="radioType">
      <option value="gsm">GSM</option>
      <option value="wcdma">WCDMA</option>
      <option value="lte">LTE</option>
      <option value="nr">5G (NR)</option>
    </select>

    <label>MCC:</label>
    <input id="mcc" value="310" />

    <label>MNC:</label>
    <input id="mnc" value="260" />

    <label>LAC:</label>
    <input id="lac" value="7033" />

    <label>CID:</label>
    <input id="cid" value="17811" />

    <button type="submit">Locate</button>
  </form>

  <div id="loadingBar">
    <div id="progress"></div>
  </div>

  <div id="result">
    <p id="locationText">Location will appear here...</p>
    <iframe id="map" src="" allowfullscreen></iframe>
    <div class="share-btn">
      <i class="fas fa-share-alt" title="Share Location"></i>
    </div>
  </div>

  <script>
    const form = document.getElementById('locationForm');
    const loadingBar = document.getElementById('loadingBar');
    const progress = document.getElementById('progress');
    const map = document.getElementById('map');
    const locationText = document.getElementById('locationText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      loadingBar.style.display = 'block';
      locationText.textContent = 'Locating...';
      map.src = '';

      const radio = document.getElementById('radioType').value;
      const mcc = parseInt(document.getElementById('mcc').value);
      const mnc = parseInt(document.getElementById('mnc').value);
      const lac = parseInt(document.getElementById('lac').value);
      const cid = parseInt(document.getElementById('cid').value);

      const payload = {
        token: 'pk.29e69f80b9f69d27836f37d2d63c5efb',
        radio,
        mcc,
        mnc,
        cells: [{ lac, cid }],
        address: 1
      };

      try {
        const res = await fetch('https://us1.unwiredlabs.com/v2/process.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.status === 'ok') {
          locationText.textContent = `Latitude: ${data.lat}, Longitude: ${data.lon}\nAddress: ${data.address || "N/A"}`;
          map.src = `https://maps.google.com/maps?q=${data.lat},${data.lon}&z=15&output=embed`;
        } else {
          locationText.textContent = `Error: ${data.message || "Something went wrong"}`;
        }

      } catch (error) {
        locationText.textContent = 'Failed to get location.';
        console.error(error);
      } finally {
        loadingBar.style.display = 'none';
      }
    });
  </script>
</body>
</html>
